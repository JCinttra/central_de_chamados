<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Central de Chamados PCP/TI</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background:#f4f6f9; margin:0; padding:0; color:#222;
         display:flex; align-items:center; justify-content:center; height:100vh; }
  .box { background:#fff; border-radius:12px; padding:32px; box-shadow:0 4px 16px rgba(0,0,0,.12); width:340px; }
  .box h1 { margin:0 0 6px; font-size:20px; color:#0d47a1; text-align:center; }
  .box p { margin:0 0 20px; font-size:13px; color:#666; text-align:center; }
  label { font-size:13px; font-weight:bold; display:block; margin-bottom:4px; margin-top:14px; }
  input { width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:14px; box-sizing:border-box; }
  button { width:100%; margin-top:22px; background:#0d47a1; color:#fff; border:none; padding:12px; border-radius:8px;
            font-weight:bold; font-size:15px; cursor:pointer; }
  button:hover { background:#093275; }
  .msg { color:#c62828; font-size:13px; margin-top:10px; text-align:center; min-height:16px; }
  .info { font-size:11px; color:#999; text-align:center; margin-top:16px; line-height:1.5; }
</style>
</head>
<body>
  <div class="box">
    <h1>Central de Chamados</h1>
    <p>PCP - Suporte de TI</p>
    <form id="loginForm">
      <label>Nome / Usuário</label>
      <input type="text" id="usuario" placeholder="Seu nome ou ADM" required>
      <label>Senha</label>
      <input type="password" id="senha" placeholder="Apenas obrigatória para ADM">
      <button type="submit">Entrar</button>
      <div class="msg" id="msg"></div>
    </form>
    <p class="info">Colaboradores da PCP: informe seu nome e clique em Entrar (sem senha).<br>
    Ponto focal de TI (ADM): informe usuário ADM e a senha de administrador.</p>
  </div>

<script>
  const ADMIN_USER = "ADM";
  const ADMIN_PASS_HASH = "pcp2026"; // senha simples definida no codigo-fonte

  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const usuario = document.getElementById('usuario').value.trim();
    const senha = document.getElementById('senha').value;
    const msg = document.getElementById('msg');

    if (!usuario) {
      msg.textContent = "Informe seu nome de usuário.";
      return;
    }

    if (usuario.toUpperCase() === ADMIN_USER) {
      if (senha === ADMIN_PASS_HASH) {
        localStorage.setItem('pcp_role', 'admin');
        localStorage.setItem('pcp_user', 'ADM');
        window.location.href = "admin.html";
      } else {
        msg.textContent = "Senha de administrador incorreta.";
      }
      return;
    }

    // Login simples para colaboradores (sem senha)
    localStorage.setItem('pcp_role', 'user');
    localStorage.setItem('pcp_user', usuario);
    window.location.href = "index.html";
  });
</script>
</body>
</html>
