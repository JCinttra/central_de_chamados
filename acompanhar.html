<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Acompanhar chamado | Planejamento</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Central de Chamados do Planejamento</h1>
  <p>Consulte o andamento de sua solicitação.</p>
</header>

<nav class="nav">
  <a href="index.html">Abrir chamado</a>
  <a href="acompanhar.html">Acompanhar chamado</a>
  <a href="admin.html">Área ADM</a>
</nav>

<main class="container">
  <section class="card">
    <h2>Acompanhar chamado</h2>
    <p class="small">
      Informe apenas o protocolo recebido no momento da abertura do chamado.
    </p>

    <form id="consulta">
      <div class="grid">
        <div class="full">
          <label for="protocolo">Protocolo *</label>
          <input
            id="protocolo"
            placeholder="Ex.: PLAN-2026-123456"
            required
          >
        </div>
      </div>

      <br>
      <button class="btn" type="submit">Consultar</button>
      <div id="msg" class="notice"></div>
    </form>
  </section>

  <section id="resultado" class="hidden"></section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
  const msg = document.getElementById('msg');
  const res = document.getElementById('resultado');

  function aviso(texto, tipo) {
    msg.textContent = texto;
    msg.className = 'notice ' + tipo;
  }

  function badge(status) {
    const classe = {
      'Aberto': 'aberto',
      'Em atendimento': 'atendimento',
      'Aguardando usuário': 'aguardando',
      'Concluído': 'concluido'
    }[status] || 'aberto';

    return '<span class="badge ' + classe + '">' + esc(status) + '</span>';
  }

  function data(valor) {
    return valor && valor.toDate
      ? valor.toDate().toLocaleString('pt-BR')
      : '—';
  }

  function esc(valor) {
    const div = document.createElement('div');
    div.textContent = valor || '';
    return div.innerHTML;
  }

  document.getElementById('consulta').addEventListener('submit', async function (e) {
    e.preventDefault();

    res.className = 'hidden';
    aviso('Consultando...', 'info');

    const protocoloInformado = document
      .getElementById('protocolo')
      .value
      .trim()
      .toUpperCase();

    try {
      const consulta = await db
        .collection('chamados')
        .where('protocolo', '==', protocoloInformado)
        .get();

      if (consulta.empty) {
        aviso(
          'Chamado não encontrado. Confira o protocolo informado.',
          'error'
        );
        return;
      }

      const doc = consulta.docs[0];
      const chamado = {
        id: doc.id,
        ...doc.data()
      };

      aviso('', '');

      const responsavelHtml = chamado.responsavelNome
        ? '<span class="resp">Atendido por: ' +
          esc(chamado.responsavelNome) +
          '</span>'
        : '<span class="resp resp-none">Ainda não atribuído a um atendente</span>';

      res.innerHTML =
        '<div class="card">' +
          '<div class="item-top">' +
            '<div>' +
              '<h2>' + esc(chamado.assunto) + '</h2>' +
              '<p class="small">' +
                'Protocolo: <b>' + esc(chamado.protocolo) + '</b>' +
                ' · Aberto em ' + data(chamado.criadoEm) +
              '</p>' +
              responsavelHtml +
            '</div>' +
            badge(chamado.status) +
          '</div>' +

          '<p><b>Tipo:</b> ' + esc(chamado.tipo) +
          ' · <b>Prioridade:</b> ' + esc(chamado.prioridade) + '</p>' +

          '<p><b>Descrição:</b><br>' +
          esc(chamado.descricao) + '</p>' +

          '<h3>Histórico do atendimento</h3>' +
          '<div id="historico">Carregando histórico...</div>' +
        '</div>';

      res.className = '';

      const mensagens = await db
        .collection('chamados')
        .doc(chamado.id)
        .collection('mensagens')
        .orderBy('criadoEm', 'asc')
        .get();

      document.getElementById('historico').innerHTML = mensagens.empty
        ? '<p class="small">Ainda não há atualizações do atendimento.</p>'
        : mensagens.docs.map(function (item) {
            const mensagem = item.data();

            return (
              '<div class="comment">' +
                '<b>' + esc(mensagem.autor || 'TI') + '</b> ' +
                '<span class="small">' + data(mensagem.criadoEm) + '</span>' +
                '<p>' + esc(mensagem.texto) + '</p>' +
              '</div>'
            );
          }).join('');

    } catch (erro) {
      console.error(erro);
      aviso('Não foi possível realizar a consulta. Tente novamente.', 'error');
    }
  });
</script>

</body>
</html>
