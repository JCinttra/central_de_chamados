<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acompanhar chamado | PCP</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>Central de Chamados de TI — PCP</h1><p>Consulte o andamento de sua solicitação.</p></header><nav class="nav"><a href="index.html">Abrir chamado</a><a href="acompanhar.html">Acompanhar chamado</a><a href="admin.html">Área ADM</a></nav>
<main class="container"><section class="card"><h2>Acompanhar chamado</h2><p class="small">Informe o protocolo recebido ao abrir o chamado e o mesmo nome utilizado no cadastro.</p><form id="consulta"><div class="grid"><div><label>Protocolo *</label><input id="protocolo" placeholder="Ex.: PCP-2026-123456" required></div><div><label>Seu nome completo *</label><input id="nome" required></div></div><br><button class="btn" type="submit">Consultar</button><div id="msg" class="notice"></div></form></section><section id="resultado" class="hidden"></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script>
const msg=document.getElementById('msg'),res=document.getElementById('resultado');function aviso(t,c){msg.textContent=t;msg.className='notice '+c}function badge(s){return '<span class="badge '+({'Aberto':'aberto','Em atendimento':'atendimento','Aguardando usuário':'aguardando','Concluído':'concluido'}[s]||'aberto')+'">'+s+'</span>'}function data(v){return v&&v.toDate?v.toDate().toLocaleString('pt-BR'):'—'}
document.getElementById('consulta').addEventListener('submit',async e=>{e.preventDefault();res.className='hidden';aviso('Consultando...','info');try{const q=await db.collection('chamados').where('protocolo','==',protocolo.value.trim().toUpperCase()).get();const d=q.docs.map(x=>({id:x.id,...x.data()})).find(x=>x.nomeSolicitante.toLowerCase()===nome.value.trim().toLowerCase());if(!d){aviso('Chamado não encontrado. Confira o protocolo e o nome informado.','error');return}aviso('','');res.innerHTML='<div class="card"><div class="item-top"><div><h2>'+esc(d.assunto)+'</h2><p class="small">Protocolo: <b>'+esc(d.protocolo)+'</b> · Aberto em '+data(d.criadoEm)+'</p></div>'+badge(d.status)+'</div><p><b>Tipo:</b> '+esc(d.tipo)+' · <b>Prioridade:</b> '+esc(d.prioridade)+'</p><p><b>Descrição:</b><br>'+esc(d.descricao)+'</p><h3>Histórico do atendimento</h3><div id="historico">Carregando histórico...</div></div>';res.className='';const cm=await db.collection('chamados').doc(d.id).collection('mensagens').orderBy('criadoEm','asc').get();document.getElementById('historico').innerHTML=cm.empty?'<p class="small">Ainda não há atualizações do atendimento.</p>':cm.docs.map(x=>{let m=x.data();return '<div class="comment"><b>'+esc(m.autor||'TI')+'</b> <span class="small">'+data(m.criadoEm)+'</span><p>'+esc(m.texto)+'</p></div>'}).join('')}catch(err){console.error(err);aviso('Não foi possível realizar a consulta. Tente novamente.','error')}});function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}</script></body></html>
